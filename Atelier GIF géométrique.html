<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atelier GIF – Géométrie sacrée</title>
<style>
:root{--bg:#0d0c12;--pn:#16141d;--tx:#efe7d2;--or:#d4a64a;--ln:#2e2a3a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme=dark]){--bg:#f6f1e4;--pn:#fffaf0;--tx:#241f14;--or:#8a6414;--ln:#d9cfb5;color-scheme:light}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,sans-serif}
h1{font:600 26px Georgia,serif;color:var(--or);text-align:center;margin:14px 8px 2px}
p.sub{text-align:center;margin:0 8px 8px;opacity:.75;font-size:13px}
.wrap{display:flex;flex-wrap:wrap;gap:16px;padding:12px;max-width:1100px;margin:auto}
.stage{flex:1 1 420px;min-width:0}
canvas{width:100%;max-width:100%;border:1px solid var(--or);border-radius:8px;touch-action:none;background:#000;cursor:grab}
.panel{flex:1 1 300px;min-width:0}
fieldset{border:1px solid var(--ln);background:var(--pn);border-radius:8px;margin:0 0 10px;padding:8px 12px}
legend{color:var(--or);padding:0 6px}
label{display:block;margin:5px 0;font-size:13px}
input[type=range],select{width:100%}
button,.btn{background:transparent;color:var(--or);border:1px solid var(--or);border-radius:6px;padding:6px 10px;margin:3px 3px 3px 0;cursor:pointer;font:inherit}
button:hover{background:var(--or);color:var(--bg)}
#sw input{width:42px;height:34px;padding:0;border:1px solid var(--ln);background:none;margin:2px}
.ck{display:inline-block;margin-right:10px}
#res img{max-width:100%;border:1px solid var(--or);border-radius:6px;margin-top:6px}
</style></head><body>
<h1>✦ Atelier GIF géométrique ✦</h1>
<p class="sub">Importez une image : elle est découpée en formes selon ses couleurs et ses traits, puis recolorée, étirée et animée.</p>
<div class="wrap">
<div class="stage"><canvas id="cv" width="420" height="420"></canvas>
<p class="sub">Glissez le doigt ou la souris sur l’image pour tendre les formes.</p></div>
<div class="panel">
<fieldset><legend>Image</legend>
<input type="file" id="file" accept="image/*"> <button id="demo">Image d’exemple</button></fieldset>
<fieldset><legend>Découpe géométrique</legend>
<label>Finesse de la grille <input type="range" id="fin" min="14" max="60" value="30"></label>
<label>Sensibilité aux détails (subdivision) <input type="range" id="det" min="100" max="3000" value="700"></label>
<label>Familles de couleurs <input type="range" id="nb" min="3" max="10" value="6"></label>
<label class="ck"><input type="checkbox" id="tr"> traits dorés</label></fieldset>
<fieldset><legend>Échange de couleurs</legend>
<div id="sw"></div>
<label>Conserver les nuances <input type="range" id="nu" min="0" max="1.5" step=".05" value="1"></label>
<label>Rotation de teinte <input type="range" id="hu" min="0" max="360" value="0"></label>
<button id="perm">Permuter</button><button id="alea">Aléatoire</button><button id="rst">Origine</button></fieldset>
<fieldset><legend>Animation</legend>
<span class="ck"><label><input type="checkbox" id="vor" checked> vortex</label></span>
<span class="ck"><label><input type="checkbox" id="pul" checked> pulsation</label></span>
<span class="ck"><label><input type="checkbox" id="ros"> rosace</label></span>
<span class="ck"><label><input type="checkbox" id="ond"> onde</label></span>
<span class="ck"><label><input type="checkbox" id="ecl"> éclosion</label></span>
<label>Intensité <input type="range" id="int" min="0" max="2" step=".05" value="1"></label>
<label>Pétales de la rosace <input type="range" id="pet" min="3" max="12" value="6"></label>
<label>Kaléidoscope <select id="kal"><option value="0">aucun</option><option value="4">4 branches</option><option value="6">6 branches</option><option value="8">8 branches</option><option value="12">12 branches</option></select></label>
<label class="ck"><input type="checkbox" id="rot"> le kaléidoscope tourne</label>
<label>Géométrie sacrée superposée <select id="ov"><option value="">aucune</option><option value="fleur" selected>Fleur de vie</option><option value="etoile">Étoile à six branches</option><option value="spire">Spirale d’or</option></select></label>
<label>Rayon des tirages <input type="range" id="ray" min="20" max="160" value="70"></label>
<label class="ck"><input type="checkbox" id="viv" checked> les tirages respirent</label>
<button id="clr">Effacer les tirages</button></fieldset>
<fieldset><legend>Exporter</legend>
<label>Nombre d’images <input type="range" id="nf" min="12" max="60" value="36"></label>
<label>Images par seconde <input type="range" id="fps" min="8" max="30" value="18"></label>
<button id="go">Créer le GIF</button> <span id="pg"></span><div id="res"></div></fieldset>
</div></div>
<script>
const $=id=>document.getElementById(id),TAU=Math.PI*2,ck=id=>$(id).checked;
const cv=$("cv"),cx=cv.getContext("2d",{willReadFrequently:true}),sc=document.createElement("canvas"),sx=sc.getContext("2d");
let W=420,H=420,img,tris=[],cents=[],cols=[],pulls=[],drag=null;
const lum=c=>.3*c[0]+.59*c[1]+.11*c[2],cl8=v=>Math.max(0,Math.min(255,Math.round(v)));
const hex=c=>"#"+c.map(v=>cl8(v).toString(16).padStart(2,"0")).join(""),unhex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const dist=(a,b)=>(a[0]-b[0])**2+(a[1]-b[1])**2+(a[2]-b[2])**2,mid=(a,b)=>[(a[0]+b[0])/2,(a[1]+b[1])/2];
function px(x,y){x=Math.max(0,Math.min(W-1,x|0));y=Math.max(0,Math.min(H-1,y|0));const k=(y*W+x)*4,d=img.data;return[d[k],d[k+1],d[k+2]]}
function rot(c,h){if(!h)return c;const[r,g,b]=c.map(v=>v/255),mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,d=mx-mn;let hh=0,s=0;
 if(d){s=d/(1-Math.abs(2*l-1));hh=mx==r?((g-b)/d+6)%6:mx==g?(b-r)/d+2:(r-g)/d+4;hh*=60}
 hh=(hh+h)%360;const a=s*Math.min(l,1-l),f=n=>{const k=(n+hh/30)%12;return(l-a*Math.max(-1,Math.min(k-3,9-k,1)))*255};return[f(0),f(8),f(4)]}
function load(i){const m=Math.min(1,440/Math.max(i.width,i.height));W=Math.round(i.width*m);H=Math.round(i.height*m);
 cv.width=sc.width=W;cv.height=sc.height=H;cx.drawImage(i,0,0,W,H);img=cx.getImageData(0,0,W,H);pulls=[];build()}
function demo(){const c=document.createElement("canvas");c.width=c.height=420;const g=c.getContext("2d");
 let q=g.createLinearGradient(0,0,0,420);q.addColorStop(0,"#1b2a6b");q.addColorStop(.6,"#d0527a");q.addColorStop(1,"#f6b24a");g.fillStyle=q;g.fillRect(0,0,420,420);
 g.fillStyle="#fff3c4";g.beginPath();g.arc(210,200,95,0,TAU);g.fill();
 g.fillStyle="#2b1840";g.beginPath();g.moveTo(0,420);g.lineTo(0,330);g.lineTo(110,250);g.lineTo(200,330);g.lineTo(300,230);g.lineTo(420,340);g.lineTo(420,420);g.fill();
 g.strokeStyle="#ffd36b";g.lineWidth=5;for(let i=0;i<6;i++){g.beginPath();g.arc(210,200,120+i*14,0,TAU);g.stroke()}load(c)}
$("file").onchange=e=>{const f=e.target.files[0];if(!f)return;const i=new Image();i.onload=()=>load(i);i.src=URL.createObjectURL(f)};
$("demo").onclick=demo;
function build(){
 const s=+$("fin").value,thr=+$("det").value,K=+$("nb").value,g=new Float32Array(W*H),L=(x,y)=>lum(px(x,y));
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){
  const a=L(x+1,y-1)+2*L(x+1,y)+L(x+1,y+1)-L(x-1,y-1)-2*L(x-1,y)-L(x-1,y+1),b=L(x-1,y+1)+2*L(x,y+1)+L(x+1,y+1)-L(x-1,y-1)-2*L(x,y-1)-L(x+1,y-1);g[y*W+x]=Math.hypot(a,b)}
 const nx=Math.ceil(W/s),ny=Math.ceil(H/s),V=[];
 for(let j=0;j<=ny;j++){const row=[];for(let i=0;i<=nx;i++){let x=i*W/nx,y=j*H/ny;
  if(i>0&&i<nx&&j>0&&j<ny){let bx=x,by=y,bg=-1;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const xx=x+dx*s*.3,yy=y+dy*s*.3,v=g[(yy|0)*W+(xx|0)]*(dx||dy?1:1.1);if(v>bg){bg=v;bx=xx;by=yy}}x=bx;y=by}
  row.push([x,y])}V.push(row)}
 tris=[];const B=[[1/3,1/3,1/3],[.6,.2,.2],[.2,.6,.2],[.2,.2,.6],[.45,.45,.1],[.1,.45,.45],[.45,.1,.45]];
 function add(a,b,c,d){const cs=B.map(w=>px(w[0]*a[0]+w[1]*b[0]+w[2]*c[0],w[0]*a[1]+w[1]*b[1]+w[2]*c[1])),
  m=[0,1,2].map(k=>cs.reduce((u,v)=>u+v[k],0)/7),va=cs.reduce((u,v)=>u+dist(v,m),0)/7,
  ar=Math.abs((b[0]-a[0])*(c[1]-a[1])-(c[0]-a[0])*(b[1]-a[1]))/2;
  if(va>thr&&d<3&&ar>40){const ab=mid(a,b),bc=mid(b,c),ca=mid(c,a);add(a,ab,ca,d+1);add(ab,b,bc,d+1);add(ca,bc,c,d+1);add(ab,bc,ca,d+1)}
  else tris.push({p:[a,b,c],c:m,cl:0})}
 for(let j=0;j<ny;j++)for(let i=0;i<nx;i++){const a=V[j][i],b=V[j][i+1],c=V[j+1][i],d=V[j+1][i+1];
  if(dist(px(...a),px(...d))<dist(px(...b),px(...c))){add(a,b,d,0);add(a,d,c,0)}else{add(a,b,c,0);add(b,d,c,0)}}
 let C=[tris[0].c.slice()];
 while(C.length<K){let best=tris[0],bd=-1;for(const t of tris){const d=Math.min(...C.map(u=>dist(u,t.c)));if(d>bd){bd=d;best=t}}C.push(best.c.slice())}
 for(let it=0;it<6;it++){const S=C.map(()=>[0,0,0,0]);
  for(const t of tris){let bi=0,bd=1e9;C.forEach((u,i)=>{const d=dist(u,t.c);if(d<bd){bd=d;bi=i}});t.cl=bi;const s=S[bi];s[0]+=t.c[0];s[1]+=t.c[1];s[2]+=t.c[2];s[3]++}
  C=C.map((u,i)=>S[i][3]?[S[i][0]/S[i][3],S[i][1]/S[i][3],S[i][2]/S[i][3]]:u)}
 cents=C;cols=C.map(hex);swatches();recolor()}
function swatches(){$("sw").innerHTML="";cols.forEach((c,i)=>{const e=document.createElement("input");e.type="color";e.value=c;e.oninput=()=>{cols[i]=e.value;recolor()};$("sw").append(e)})}
function recolor(){const nu=+$("nu").value,h=+$("hu").value;
 for(const t of tris){const n=unhex(cols[t.cl]),sh=(lum(t.c)-lum(cents[t.cl]))*nu;t.f=hex(rot(n.map(v=>cl8(v+sh)),h))}}
$("nu").oninput=$("hu").oninput=recolor;
$("fin").onchange=$("det").onchange=$("nb").onchange=()=>img&&build();
$("perm").onclick=()=>{cols.push(cols.shift());swatches();recolor()};
$("alea").onclick=()=>{cols=cols.map(()=>hex(rot([90+Math.random()*140,70+Math.random()*120,60+Math.random()*120],Math.random()*360)));swatches();recolor()};
$("rst").onclick=()=>{cols=cents.map(hex);swatches();recolor()};
$("clr").onclick=()=>pulls=[];
function disp(x,y,t,I,f,pl){const cx0=W/2,cy0=H/2,R=Math.hypot(W,H)/2;let dx=x-cx0,dy=y-cy0,r=Math.hypot(dx,dy),a=Math.atan2(dy,dx);
 if(ck("vor"))a+=I*1.6*Math.sin(TAU*t)*(1-Math.min(1,r/R));
 if(ck("ros"))r*=1+.12*I*Math.cos(+$("pet").value*a-TAU*t);
 if(ck("pul"))r*=1+.1*I*Math.sin(TAU*t-4*r/R);
 x=cx0+r*Math.cos(a);y=cy0+r*Math.sin(a);
 if(ck("ond")){x+=I*8*Math.sin(TAU*(t+y/90));y+=I*8*Math.sin(TAU*(t+x/90))}
 for(const p of pl){const w=Math.exp(((x-p.x)**2+(y-p.y)**2)/(-2*p.s*p.s))*(p.live?1:f);x+=p.dx*w;y+=p.dy*w}
 return[x,y]}
function draw(t){if(!img)return;const I=+$("int").value,f=ck("viv")?.5-.5*Math.cos(TAU*t):1,pl=drag?pulls.concat([drag]):pulls,ec=ck("ecl"),tr=ck("tr");
 sx.fillStyle="#07060b";sx.fillRect(0,0,W,H);sx.lineJoin="round";sx.lineWidth=1.2;
 for(const q of tris){let P=q.p.map(p=>disp(p[0],p[1],t,I,f,pl));
  if(ec){const gx=(P[0][0]+P[1][0]+P[2][0])/3,gy=(P[0][1]+P[1][1]+P[2][1])/3,e=Math.sin(Math.PI*t)**2,k=1-.55*I*Math.min(1,e),th=I*1.5*e,co=Math.cos(th)*k,si=Math.sin(th)*k;
   P=P.map(p=>[gx+(p[0]-gx)*co-(p[1]-gy)*si,gy+(p[0]-gx)*si+(p[1]-gy)*co])}
  sx.beginPath();sx.moveTo(P[0][0],P[0][1]);sx.lineTo(P[1][0],P[1][1]);sx.lineTo(P[2][0],P[2][1]);sx.closePath();
  sx.fillStyle=sx.strokeStyle=q.f;sx.fill();if(!ec)sx.stroke();
  if(tr){sx.strokeStyle="rgba(212,166,74,.6)";sx.lineWidth=.6;sx.stroke();sx.lineWidth=1.2}}
 const n=+$("kal").value;
 if(n>1){const a=TAU/n,R=Math.hypot(W,H);cx.fillStyle="#07060b";cx.fillRect(0,0,W,H);
  for(let k=0;k<n;k++){cx.save();cx.translate(W/2,H/2);cx.rotate(k*a);if(k&1){cx.rotate(a);cx.scale(1,-1)}
   cx.beginPath();cx.moveTo(0,0);cx.lineTo(R,0);cx.lineTo(R*Math.cos(a),R*Math.sin(a));cx.closePath();cx.clip();
   if(ck("rot"))cx.rotate(TAU*t);cx.drawImage(sc,-W/2,-H/2);cx.restore()}}
 else cx.drawImage(sc,0,0);
 overlay(t)}
function overlay(t){const o=$("ov").value;if(!o)return;const m=Math.min(W,H);cx.save();cx.translate(W/2,H/2);cx.strokeStyle="rgba(244,205,110,.85)";cx.lineWidth=1.4;cx.shadowColor="#000";cx.shadowBlur=3;
 if(o=="fleur"){const r=m/6*(1+.08*Math.sin(TAU*t));cx.rotate(TAU*t/6);
  for(let i=-3;i<=3;i++)for(let j=-3;j<=3;j++){const x=i*r+j*r/2,y=j*r*Math.sqrt(3)/2;if(Math.hypot(x,y)<=2*r+1){cx.beginPath();cx.arc(x,y,r,0,TAU);cx.stroke()}}}
 else if(o=="etoile"){const r=m*.4*(1+.05*Math.sin(TAU*t));cx.rotate(TAU*t/3);
  for(let k=0;k<2;k++){cx.beginPath();for(let i=0;i<3;i++){const a=i*TAU/3+k*Math.PI-Math.PI/2;cx[i?"lineTo":"moveTo"](r*Math.cos(a),r*Math.sin(a))}cx.closePath();cx.stroke()}
  cx.beginPath();cx.arc(0,0,r,0,TAU);cx.stroke();cx.beginPath();cx.arc(0,0,r/2,0,TAU);cx.stroke()}
 else{cx.rotate(TAU*t);const ph=(1+Math.sqrt(5))/2;cx.beginPath();for(let a=0;a<TAU*3.2;a+=.05){const r=m*.012*Math.pow(ph,2*a/Math.PI);cx[a?"lineTo":"moveTo"](r*Math.cos(a),r*Math.sin(a))}cx.stroke()}
 cx.restore()}
let busy=false;
function loop(now){if(!busy){const d=$("nf").value/$("fps").value*1000;draw((now%d)/d)}requestAnimationFrame(loop)}
function pos(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height]}
cv.onpointerdown=e=>{const[x,y]=pos(e);cv.setPointerCapture(e.pointerId);drag={x,y,sx:x,sy:y,dx:0,dy:0,s:+$("ray").value,live:true}};
cv.onpointermove=e=>{if(!drag)return;const[x,y]=pos(e);drag.dx=x-drag.sx;drag.dy=y-drag.sy};
cv.onpointerup=cv.onpointercancel=()=>{if(drag&&Math.abs(drag.dx)+Math.abs(drag.dy)>3){drag.live=false;pulls.push(drag)}drag=null};
function lzw(ix){const by=[];let cu=0,nb=0,size=9,next=258;const emit=c=>{cu|=c<<nb;nb+=size;while(nb>=8){by.push(cu&255);cu>>=8;nb-=8}};
 let d=new Map(),p=ix[0];emit(256);
 for(let i=1;i<ix.length;i++){const k=p<<8|ix[i],v=d.get(k);if(v!==undefined){p=v;continue}
  emit(p);d.set(k,next++);if(next-1>=(1<<size)&&size<12)size++;if(next>=4096){emit(256);d.clear();size=9;next=258}p=ix[i]}
 emit(p);emit(257);if(nb>0)by.push(cu&255);return by}
function gif(frames,delay){const b=[],w=v=>b.push(v&255,v>>8&255),s=t=>{for(const c of t)b.push(c.charCodeAt(0))};
 s("GIF89a");w(W);w(H);b.push(247,0,0);
 for(let i=0;i<256;i++)b.push((i>>5)*255/7|0,((i>>2)&7)*255/7|0,(i&3)*85);
 b.push(33,255,11);s("NETSCAPE2.0");b.push(3,1,0,0,0);
 for(const ix of frames){b.push(33,249,4,0);w(delay);b.push(0,0,44);w(0);w(0);w(W);w(H);b.push(0,8);
  const z=lzw(ix);for(let i=0;i<z.length;i+=255){const c=z.slice(i,i+255);b.push(c.length);for(const v of c)b.push(v)}b.push(0)}
 b.push(59);return new Uint8Array(b)}
$("go").onclick=async()=>{if(!img||busy)return;busy=true;const N=+$("nf").value,fr=[];
 for(let k=0;k<N;k++){draw(k/N);const d=cx.getImageData(0,0,W,H).data,ix=new Uint8Array(W*H);
  for(let i=0;i<ix.length;i++)ix[i]=(d[i*4]>>5)<<5|(d[i*4+1]>>5)<<2|d[i*4+2]>>6;fr.push(ix);
  $("pg").textContent=Math.round((k+1)/N*100)+" %";await new Promise(r=>setTimeout(r))}
 const u=URL.createObjectURL(new Blob([gif(fr,Math.round(100/$("fps").value))],{type:"image/gif"}));
 $("res").innerHTML="";const im=new Image();im.src=u;const a=document.createElement("a");a.href=u;a.download="geometrie-sacree.gif";a.className="btn";a.textContent="Télécharger le GIF";
 $("res").append(a,document.createElement("br"),im);$("pg").textContent="";busy=false};
demo();requestAnimationFrame(loop);
</script></body></html>
